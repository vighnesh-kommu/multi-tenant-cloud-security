
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Tenant Cloud Security Test</title>
  <style>
    
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  background: #08111f;
  color: #e8eef8;
}

.container {
  width: 100%;
  max-width: 460px;
  margin: auto;
  padding: 30px 24px;
  background: #111d30;
  border: 1px solid #263955;
  border-radius: 18px;
  box-shadow: 0 20px 55px rgba(0,0,0,.35);
}

h2 {
  margin: 0 0 10px;
  font-size: 26px;
  color: #ffffff;
  letter-spacing: -.5px;
}

p {
  color: #9aabc3;
  font-size: 14px;
  line-height: 1.6;
}

h3 {
  margin-top: 28px;
  margin-bottom: 12px;
  font-size: 16px;
  color: #c9d9f2;
}

input {
  width: 100%;
  padding: 15px;
  margin: 7px 0;
  border: 1px solid #344762;
  border-radius: 9px;
  background: #0b1628;
  color: white;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #3998ff;
  box-shadow: 0 0 0 3px rgba(57,152,255,.15);
}

button {
  width: 100%;
  padding: 14px;
  margin: 7px 0;
  border: 0;
  border-radius: 9px;
  background: #1677e8;
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  opacity: .8;
}

#logoutBtn {
  background: #263955;
}

#tenantABtn,
#tenantBBtn {
  background: #172b45;
  border: 1px solid #365477;
}

#result {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin-top: 20px;
  padding: 16px;
  border: 1px solid #30445f;
  border-radius: 10px;
  background: #0a1526;
  color: #b9d6f8;
  font-size: 13px;
  line-height: 1.7;
}

@media (max-width: 480px) {
  body {
    padding: 14px;
  }

  .container {
    padding: 24px 18px;
  }

  h2 {
    font-size: 23px;
  }
}

  </style>
</head>
<body>
<div class="container">
  <h2>Multi-Tenant Cloud Security</h2>
  <p>Firebase Authentication & Firestore Isolation Test</p>

  <h3>Login</h3>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button id="loginBtn">Login</button>
  <button id="logoutBtn">Logout</button>

  <h3>Tenant Data Access Test</h3>
  <button id="tenantABtn">Read Tenant A Data</button>
  <button id="tenantBBtn">Read Tenant B Data</button>

  <div id="result">Please login to start.</div>
</div>

<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

  import {
    getFirestore,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDyAqQKO-0cB1CCgVb3JYvn2FSfgPWKK7o",
    authDomain: "multi-tenant-cloud-security.firebaseapp.com",
    projectId: "multi-tenant-cloud-security",
    storageBucket: "multi-tenant-cloud-security.firebasestorage.app",
    messagingSenderId: "241642930606",
    appId: "1:241642930606:web:08e08cde26360cecdf883f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const result = document.getElementById("result");

  document.getElementById("loginBtn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const credential = await signInWithEmailAndPassword(auth, email, password);
      result.textContent = "LOGIN SUCCESSFUL\nUID: " + credential.user.uid;
    } catch (error) {
      result.textContent = "LOGIN FAILED\n" + error.code + "\n" + error.message;
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    try {
      await signOut(auth);
      result.textContent = "Logged out successfully.";
    } catch (error) {
      result.textContent = "LOGOUT FAILED: " + error.message;
    }
  });

  async function readTenant(tenantId) {
    if (!auth.currentUser) {
      result.textContent = "Please login first.";
      return;
    }

    result.textContent = "Checking access to " + tenantId + "...";

    try {
      const snapshot = await getDocs(
        collection(db, "tenants", tenantId, "documents")
      );

      if (snapshot.empty) {
        result.textContent =
          "ACCESS ALLOWED\nNo documents found for " + tenantId;
        return;
      }

      let output = "ACCESS ALLOWED\nTenant: " + tenantId + "\n\n";

      snapshot.forEach((doc) => {
        output += JSON.stringify(doc.data(), null, 2) + "\n";
      });

      result.textContent = output;
    } catch (error) {
      if (
        error.code === "permission-denied" ||
        error.code === "firestore/permission-denied"
      ) {
        result.textContent =
          "ACCESS DENIED\nFirestore Security Rules blocked access to " +
          tenantId;
      } else {
        result.textContent =
          "REQUEST FAILED\n" + error.code + "\n" + error.message;
      }
    }
  }

  document.getElementById("tenantABtn").addEventListener("click", () => {
    readTenant("Tenant_A");
  });

  document.getElementById("tenantBBtn").addEventListener("click", () => {
    readTenant("Tenant_B");
  });
</script>
</body>
</html>
